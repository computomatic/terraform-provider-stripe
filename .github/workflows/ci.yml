name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Generated files are current
        run: |
          go generate ./internal/generated
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run: go generate ./internal/generated"
            git status --short
            git diff
            exit 1
          fi
      - name: Unit tests
        run: go test ./...

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Docs are current
        run: bash scripts/check-docs.sh

  acceptance-groups:
    # The fake image is not public, so pull requests from forks skip acceptance.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Raise this when a shard nears 20 minutes.
      ACCEPTANCE_GROUPS: "4"
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Group the acceptance packages
        id: groups
        run: |
          groups=$(bash scripts/acceptance-groups.sh "${ACCEPTANCE_GROUPS}")
          echo "groups=${groups}" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "group \(.index): \(.packages)"' <<< "${groups}"

  acceptance-shard:
    name: acceptance group ${{ matrix.group.index }} (${{ matrix.cli }})
    needs: acceptance-groups
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.acceptance-groups.outputs.groups) }}
        cli: [terraform, opentofu]
    env:
      TF_ACC: "1"
      FAKE_PORT: "12111"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Start the fake
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          version=$(tr -d '[:space:]' < .fake-version)
          image="ghcr.io/computomatic/fake-stripe-api:${version}"
          admin_token=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')
          echo "::add-mask::${admin_token}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker run -d --name fake-stripe-api \
            -p "127.0.0.1:${FAKE_PORT}:12111" \
            -e FAKE_STRIPE_ADMIN_TOKEN="${admin_token}" \
            "${image}"
          docker logout ghcr.io

          for _ in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer ${admin_token}" "http://127.0.0.1:${FAKE_PORT}/_fake/health" > /dev/null; then
              echo "fake ${version} is healthy"
              echo "STRIPE_FAKE_URL=http://127.0.0.1:${FAKE_PORT}" >> "$GITHUB_ENV"
              echo "STRIPE_FAKE_ADMIN_TOKEN=${admin_token}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs fake-stripe-api
          echo "the fake did not become healthy"
          exit 1
      - name: Acceptance tests
        env:
          CLI: ${{ matrix.cli }}
          PACKAGES: ${{ matrix.group.packages }}
        run: |
          if [ "${CLI}" = opentofu ]; then
            TF_ACC_TERRAFORM_PATH=$(command -v tofu)
            export TF_ACC_TERRAFORM_PATH
            export TF_ACC_PROVIDER_NAMESPACE=hashicorp
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          read -ra packages <<< "${PACKAGES}"
          go test -count=1 -timeout 20m "${packages[@]}"
      - name: Fake logs
        if: failure()
        run: docker logs fake-stripe-api
      - name: Stop the fake
        if: always()
        run: docker rm -f fake-stripe-api

  # Branch protection requires this check: it passes only when every shard passed.
  acceptance:
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [acceptance-groups, acceptance-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          GROUPS_RESULT: ${{ needs.acceptance-groups.result }}
          SHARDS_RESULT: ${{ needs.acceptance-shard.result }}
        run: |
          echo "grouping: ${GROUPS_RESULT}, shards: ${SHARDS_RESULT}"
          [ "${GROUPS_RESULT}" = success ] && [ "${SHARDS_RESULT}" = success ]
