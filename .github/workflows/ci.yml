name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: aws-linux-2cpu
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Generated files are current
        run: |
          go generate ./internal/generated
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run: go generate ./internal/generated"
            git status --short
            git diff
            exit 1
          fi
      - name: Unit tests
        run: go test ./...

  acceptance:
    runs-on: aws-linux-2cpu
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      TF_ACC: "1"
      FAKE_PORT: "12111"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Start the fake
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          version=$(tr -d '[:space:]' < .fake-version)
          image="ghcr.io/computomatic/fake-stripe-api:${version}"
          admin_token=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')
          echo "::add-mask::${admin_token}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker run -d --name fake-stripe-api \
            -p "127.0.0.1:${FAKE_PORT}:12111" \
            -e FAKE_STRIPE_ADMIN_TOKEN="${admin_token}" \
            "${image}"
          docker logout ghcr.io

          for _ in $(seq 1 60); do
            if curl -fsS -H "Authorization: Bearer ${admin_token}" "http://127.0.0.1:${FAKE_PORT}/_fake/health" > /dev/null; then
              echo "fake ${version} is healthy"
              echo "STRIPE_FAKE_URL=http://127.0.0.1:${FAKE_PORT}" >> "$GITHUB_ENV"
              echo "STRIPE_FAKE_ADMIN_TOKEN=${admin_token}" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs fake-stripe-api
          echo "the fake did not become healthy"
          exit 1
      - name: Acceptance tests (Terraform)
        run: go test -count=1 -timeout 30m ./internal/resources/...
      - name: Acceptance tests (OpenTofu)
        env:
          TF_ACC_PROVIDER_NAMESPACE: hashicorp
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
        run: |
          TF_ACC_TERRAFORM_PATH=$(command -v tofu)
          export TF_ACC_TERRAFORM_PATH
          go test -count=1 -timeout 30m ./internal/resources/...
      - name: Fake logs
        if: failure()
        run: docker logs fake-stripe-api
      - name: Stop the fake
        if: always()
        run: docker rm -f fake-stripe-api
